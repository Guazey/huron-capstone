[package]
name = "market-sidebar"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "market_sidebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Used by generate_context!() once tauri.conf.json has a "plugins" block.
serde_json = "1"
